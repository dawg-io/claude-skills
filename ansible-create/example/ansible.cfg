[defaults]
# All paths here are RELATIVE to the working directory. Run ansible from this
# directory or the inventory resolves to nothing and every play silently sees
# zero hosts — which looks like success, not an error.
inventory = inventory/home/host
roles_path = roles
collections_path = collections

# NOTE: older repos set `error_on_undefined_vars = True` here. Do not copy that
# forward — ansible-core deprecated it (it "is no longer used in the code base"
# and is removed in 2.23), and setting it now only produces a deprecation
# warning on every run. The behaviour it described is the default anyway: an
# undefined variable is a hard failure, not an empty string. That is exactly why
# every tunable belongs in a role's defaults/main.yml — a bare
# {{ maybe_defined }} with no default stops the play.

# forks is deliberately unset, so it stays at the default of 5. Raise it only
# with a reason — a group of five hosts already runs fully parallel, and adding
# serial: to "help" makes it slower, not faster.

host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
stdout_callback = yaml

# logs/ is gitignored. If ansible-lint complains it cannot write here, run lint
# from a temp directory instead — see README.
log_path = logs/ansible.log

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
