# Concern: unit tests and coverage. Called, never triggered directly.
name: test

on:
  workflow_call:
    outputs:
      coverage_artifact:
        description: Name of the artifact holding coverage.xml, for a quality gate to pull.
        value: coverage-xml

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # one version failing should not hide the others
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt -e .

      # --cov-report=xml, not the default format: it is what SonarQube can read, and
      # it is the only format worth uploading. Coverage from one version only — a
      # matrix produces N reports and merging them is a question nobody asked.
      - run: pytest --cov=widgetsvc --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
